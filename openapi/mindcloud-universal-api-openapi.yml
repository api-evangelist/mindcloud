openapi: 3.2.0
info:
  title: Mindcloud Universal API
  version: 2.0.0
  description: 'Operations tagged universal across 3 of this provider''s published API definitions: connect-mindcloud-openapi.json, connect-mindcloud-openapi.json, mindcloud-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://connect.mindcloud.co
security:
- apiKey: []
tags:
- name: universal
paths:
  /v2/universal/apps:
    get:
      operationId: v2-list-universal-apps
      summary: List published Universal API apps that have executable actions
      description: 'List published Universal API apps that have executable actions. With actionQ, meta.suggestedAction names the one action that clearly matches it.


        Each filterable field is also a query parameter: `status=active` matches it exactly, and bracket operators (eq, ne, gt, gte, lt, lte, contains, starts, ends, in, nin) compare, e.g. `createdOn[gte]=2026-01-01` or `status[in]=failed,cancelled`. contains, starts, and ends apply to text fields only.


        Requires no API key permission.'
      tags:
      - universal
      security:
      - apiKey: []
      parameters:
      - name: fields
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated fields to return; all of them when left out, and id always. Each item then carries only those keys, whatever its schema requires. Fields: id, name, slug, icon, category, type, aliases, publishedVersion, actionsTotal, actionSlugsPreview.'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated sort fields; prefix one with - for descending. Sortable fields: id, name, slug, icon, category, type, publishedVersion, actionsTotal. Without sort, results keep the order the list reads them in.'
      - name: where
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
        description: 'RSQL filter expression. Filterable fields: id, name, slug, icon, category, type, publishedVersion, actionsTotal. Operators: ==, !=, >, >=, <, <=, =in=, =out=, =like=. Logical: ; (AND), , (OR); AND binds tighter than OR. Example: "status==active;name=like=Sales*"'
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on id: `id=value` matches it exactly. Bracket operators: `id[ne]`, `id[gt]`, `id[gte]`, `id[lt]`, `id[lte]`, `id[contains]`, `id[starts]`, `id[ends]`, and `id[in]` / `id[nin]` with comma-separated values.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on name: `name=value` matches it exactly. Bracket operators: `name[ne]`, `name[gt]`, `name[gte]`, `name[lt]`, `name[lte]`, `name[contains]`, `name[starts]`, `name[ends]`, and `name[in]` / `name[nin]` with comma-separated values.'
      - name: slug
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on slug: `slug=value` matches it exactly. Bracket operators: `slug[ne]`, `slug[gt]`, `slug[gte]`, `slug[lt]`, `slug[lte]`, `slug[contains]`, `slug[starts]`, `slug[ends]`, and `slug[in]` / `slug[nin]` with comma-separated values.'
      - name: icon
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on icon: `icon=value` matches it exactly. Bracket operators: `icon[ne]`, `icon[gt]`, `icon[gte]`, `icon[lt]`, `icon[lte]`, `icon[contains]`, `icon[starts]`, `icon[ends]`, and `icon[in]` / `icon[nin]` with comma-separated values.'
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on category: `category=value` matches it exactly. Bracket operators: `category[ne]`, `category[gt]`, `category[gte]`, `category[lt]`, `category[lte]`, `category[contains]`, `category[starts]`, `category[ends]`, and `category[in]` / `category[nin]` with comma-separated values.'
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on type: `type=value` matches it exactly. Bracket operators: `type[ne]`, `type[gt]`, `type[gte]`, `type[lt]`, `type[lte]`, `type[contains]`, `type[starts]`, `type[ends]`, and `type[in]` / `type[nin]` with comma-separated values.'
      - name: publishedVersion
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on publishedVersion: `publishedVersion=value` matches it exactly. Bracket operators: `publishedVersion[ne]`, `publishedVersion[gt]`, `publishedVersion[gte]`, `publishedVersion[lt]`, `publishedVersion[lte]`, `publishedVersion[contains]`, `publishedVersion[starts]`, `publishedVersion[ends]`, and `publishedVersion[in]` / `publishedVersion[nin]` with comma-separated values.'
      - name: actionsTotal
        in: query
        required: false
        schema:
          type: integer
        description: 'Filter on actionsTotal: `actionsTotal=value` matches it exactly. Bracket operators: `actionsTotal[ne]`, `actionsTotal[gt]`, `actionsTotal[gte]`, `actionsTotal[lt]`, `actionsTotal[lte]`, and `actionsTotal[in]` / `actionsTotal[nin]` with comma-separated values.'
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Optional app search text matched against name, slug, category, type, and aliases.
      - name: actionQ
        in: query
        required: false
        schema:
          type: string
        description: Optional action intent search text. When there is one clear deterministic match, meta.suggestedAction names it without using AI.
      - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UniversalApp'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
                - success
                - data
                - meta
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://connect.mindcloud.co
  /v2/universal/apps/{appSlug}/actions:
    get:
      operationId: v2-list-universal-actions
      summary: List published Universal API actions with the appSlug, appVersion, and…
      description: 'List published Universal API actions with the appSlug, appVersion, and actionSlug needed to run them.


        Each filterable field is also a query parameter: `status=active` matches it exactly, and bracket operators (eq, ne, gt, gte, lt, lte, contains, starts, ends, in, nin) compare, e.g. `createdOn[gte]=2026-01-01` or `status[in]=failed,cancelled`. contains, starts, and ends apply to text fields only.


        Requires no API key permission.'
      tags:
      - universal
      security:
      - apiKey: []
      parameters:
      - name: appSlug
        in: path
        required: true
        schema:
          type: string
      - name: fields
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated fields to return; all of them when left out, and id always. Each item then carries only those keys, whatever its schema requires. Fields: id, appSlug, appVersion, actionSlug, name, method, operation, supports, queryCapabilities, requiredArguments, optionalArguments, responseFields, slugConflict, appId, appName, description, model, controls, responseSchema, isSchemaDynamic.'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated sort fields; prefix one with - for descending. Sortable fields: id, appSlug, appVersion, actionSlug, name, method, operation, slugConflict, appId, appName, description, model, isSchemaDynamic. Without sort, results keep the order the list reads them in.'
      - name: where
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
        description: 'RSQL filter expression. Filterable fields: id, appSlug, appVersion, actionSlug, name, method, operation, slugConflict, appId, appName, description, model, isSchemaDynamic. Operators: ==, !=, >, >=, <, <=, =in=, =out=, =like=. Logical: ; (AND), , (OR); AND binds tighter than OR. Example: "status==active;name=like=Sales*"'
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on id: `id=value` matches it exactly. Bracket operators: `id[ne]`, `id[gt]`, `id[gte]`, `id[lt]`, `id[lte]`, `id[contains]`, `id[starts]`, `id[ends]`, and `id[in]` / `id[nin]` with comma-separated values.'
      - name: appVersion
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on appVersion: `appVersion=value` matches it exactly. Bracket operators: `appVersion[ne]`, `appVersion[gt]`, `appVersion[gte]`, `appVersion[lt]`, `appVersion[lte]`, `appVersion[contains]`, `appVersion[starts]`, `appVersion[ends]`, and `appVersion[in]` / `appVersion[nin]` with comma-separated values.'
      - name: actionSlug
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on actionSlug: `actionSlug=value` matches it exactly. Bracket operators: `actionSlug[ne]`, `actionSlug[gt]`, `actionSlug[gte]`, `actionSlug[lt]`, `actionSlug[lte]`, `actionSlug[contains]`, `actionSlug[starts]`, `actionSlug[ends]`, and `actionSlug[in]` / `actionSlug[nin]` with comma-separated values.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on name: `name=value` matches it exactly. Bracket operators: `name[ne]`, `name[gt]`, `name[gte]`, `name[lt]`, `name[lte]`, `name[contains]`, `name[starts]`, `name[ends]`, and `name[in]` / `name[nin]` with comma-separated values.'
      - name: method
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on method: `method=value` matches it exactly. Bracket operators: `method[ne]`, `method[gt]`, `method[gte]`, `method[lt]`, `method[lte]`, `method[contains]`, `method[starts]`, `method[ends]`, and `method[in]` / `method[nin]` with comma-separated values.'
      - name: operation
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on operation: `operation=value` matches it exactly. Bracket operators: `operation[ne]`, `operation[gt]`, `operation[gte]`, `operation[lt]`, `operation[lte]`, `operation[contains]`, `operation[starts]`, `operation[ends]`, and `operation[in]` / `operation[nin]` with comma-separated values.'
      - name: slugConflict
        in: query
        required: false
        schema:
          type: boolean
        description: 'Filter on slugConflict: `slugConflict=value` matches it exactly. Bracket operators: `slugConflict[ne]`, `slugConflict[gt]`, `slugConflict[gte]`, `slugConflict[lt]`, `slugConflict[lte]`, and `slugConflict[in]` / `slugConflict[nin]` with comma-separated values.'
      - name: appId
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on appId: `appId=value` matches it exactly. Bracket operators: `appId[ne]`, `appId[gt]`, `appId[gte]`, `appId[lt]`, `appId[lte]`, `appId[contains]`, `appId[starts]`, `appId[ends]`, and `appId[in]` / `appId[nin]` with comma-separated values.'
      - name: appName
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on appName: `appName=value` matches it exactly. Bracket operators: `appName[ne]`, `appName[gt]`, `appName[gte]`, `appName[lt]`, `appName[lte]`, `appName[contains]`, `appName[starts]`, `appName[ends]`, and `appName[in]` / `appName[nin]` with comma-separated values.'
      - name: description
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on description: `description=value` matches it exactly. Bracket operators: `description[ne]`, `description[gt]`, `description[gte]`, `description[lt]`, `description[lte]`, `description[contains]`, `description[starts]`, `description[ends]`, and `description[in]` / `description[nin]` with comma-separated values.'
      - name: model
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on model: `model=value` matches it exactly. Bracket operators: `model[ne]`, `model[gt]`, `model[gte]`, `model[lt]`, `model[lte]`, `model[contains]`, `model[starts]`, `model[ends]`, and `model[in]` / `model[nin]` with comma-separated values.'
      - name: isSchemaDynamic
        in: query
        required: false
        schema:
          type: boolean
        description: 'Filter on isSchemaDynamic: `isSchemaDynamic=value` matches it exactly. Bracket operators: `isSchemaDynamic[ne]`, `isSchemaDynamic[gt]`, `isSchemaDynamic[gte]`, `isSchemaDynamic[lt]`, `isSchemaDynamic[lte]`, and `isSchemaDynamic[in]` / `isSchemaDynamic[nin]` with comma-separated values.'
      - name: version
        in: query
        required: false
        schema:
          default: latest
          type: string
        description: App version to search. Defaults to latest.
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Optional action search text matched against app, action, description, operation, and model.
      - name: verbosity
        in: query
        required: false
        schema:
          default: compact
          type: string
          enum:
          - compact
          - full
        description: How much action metadata to return. compact is optimized for agent search; full adds descriptions, the model, controls, and the response schema when available.
      - name: includeArguments
        in: query
        required: false
        schema:
          default: required
          type: string
          enum:
          - none
          - required
          - all
        description: How many action argument hints to include. required is the default to support simple one-call execution.
      - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UniversalAction'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
                - success
                - data
                - meta
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://connect.mindcloud.co
  /v2/universal/apps/{appSlug}/actions/{actionSlug}:
    get:
      operationId: v2-get-universal-action
      summary: Get detailed argument and response schema metadata for one Universal API action
      description: 'Get detailed argument and response schema metadata for one Universal API action.


        Requires no API key permission.'
      tags:
      - universal
      security:
      - apiKey: []
      parameters:
      - name: appSlug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          description: The app slug, for example "slack".
      - name: actionSlug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          description: The docs-style action slug, for example "send-message".
      - name: version
        in: query
        required: false
        schema:
          default: latest
          description: The app version to inspect. Defaults to latest.
          type: string
      - name: fields
        in: query
        required: false
        schema:
          description: Comma-separated fields to select from the action schema response.
          type: string
      - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/UniversalActionDetail'
                  meta:
                    type: object
                    description: 'Response metadata, on endpoints that answer it: the usage window, a step count, or the provider paging of a Universal action run.'
                required:
                - success
                - data
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Universal action not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Universal action slug conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://connect.mindcloud.co
  /v2/universal/apps/{appSlug}/actions/{actionSlug}/lookups/{argumentKey}:
    get:
      operationId: v2-resolve-universal-lookup
      summary: Resolve a Universal API lookup/list argument to the canonical API value without…
      description: 'Resolve a Universal API lookup/list argument to the canonical API value without using AI.


        Requires the API key permission universal:read.'
      tags:
      - universal
      security:
      - apiKey:
        - universal:read
      parameters:
      - name: appSlug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          description: The app slug, for example "slack".
      - name: actionSlug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          description: The docs-style action slug, for example "send-message".
      - name: argumentKey
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          description: The lookup-backed argument key to resolve.
      - name: version
        in: query
        required: false
        schema:
          default: latest
          description: The app version to inspect. Defaults to latest.
          type: string
      - name: q
        in: query
        required: false
        schema:
          description: Search text to resolve, for example a channel, user, customer, or project name.
          type: string
      - name: connectionId
        in: query
        required: false
        schema:
          description: The public MindCloud connection ID to use when the lookup source requires authentication.
          type: string
          minLength: 1
      - name: endUserId
        in: query
        required: false
        schema:
          description: Use only connections owned by this embedded end user. The API key company must own the end user.
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          default: 50
          description: Maximum lookup rows to request from the source action (1-200, default 50).
          type: integer
          minimum: 1
          maximum: 200
      - name: offset
        in: query
        required: false
        schema:
          default: 0
          description: Lookup row offset when supported by the source action.
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/UniversalLookup'
                  meta:
                    type: object
                    description: 'Response metadata, on endpoints that answer it: the usage window, a step count, or the provider paging of a Universal action run.'
                required:
                - success
                - data
        '400':
          description: Invalid query or connection selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Embedded access is disabled, the API key company scope does not match, or an Embedded end user, or a connection one owns, was selected under X-Company-Id (CHILD_SCOPE_FORBIDDEN, COMPANY_SCOPE_MISMATCH).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Action, lookup, or connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: UNIVERSAL_ACTION_SLUG_CONFLICT or CONNECTION_CHOICE_REQUIRED. Multiple usable end-user accounts require a public connectionId; error.details.candidates lists them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversalConflictErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: MindCloud could not run the lookup action (INTERNAL_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The provider answered the lookup action with a failure (PROVIDER_ERROR). error.details.reason is the provider's code and error.details.provider.status its HTTP status. MindCloud's own refusals answer 400, 403, 404, or 409 instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Embedded scope or connection storage is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://connect.mindcloud.co
  /v2/universal/apps/{appSlug}/actions/{actionSlug}/run:
    post:
      operationId: v2-run-universal-action
      summary: Run one Universal API action using a company connection, an embedded…
      description: 'Run one Universal API action using a company connection, an embedded installation, or a connected account owned by an embedded end user.


        Requires the Universal permission for the action''s declared operation: universal:read, universal:create, universal:update, or universal:delete (all four when the action declares none).'
      tags:
      - universal
      security:
      - apiKey: []
      parameters:
      - name: appSlug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: actionSlug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                arguments:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                version:
                  default: latest
                  type: string
                connectionId:
                  type: string
                  minLength: 1
                installationId:
                  type: string
                  minLength: 1
                endUserId:
                  type: string
                  minLength: 1
                options:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                fields:
                  type: string
                limit:
                  anyOf:
                  - type: string
                  - type: number
                offset:
                  anyOf:
                  - type: string
                  - type: number
                sort:
                  type: string
                where:
                  type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/UniversalActionResult'
                  meta:
                    type: object
                    description: 'Response metadata, on endpoints that answer it: the usage window, a step count, or the provider paging of a Universal action run.'
                required:
                - success
                - data
        '400':
          description: Invalid request or connection selection (including installations whose end user has not connected the app).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Embedded access is disabled, the API key company scope does not match, or an Embedded end user or installation, or a connection one owns, was selected under X-Company-Id (CHILD_SCOPE_FORBIDDEN, COMPANY_SCOPE_MISMATCH).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Universal action, connection, or installation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: UNIVERSAL_ACTION_SLUG_CONFLICT or CONNECTION_CHOICE_REQUIRED. Multiple usable end-user accounts require a public connectionId; error.details.candidates lists them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversalConflictErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: MindCloud could not run the action (INTERNAL_ERROR, for example UNEXPECTED_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The provider answered with a failure (PROVIDER_ERROR). error.details.reason is the provider's code and error.details.provider.status its HTTP status. MindCloud's own refusals before the provider call answer 400, 403, 404, or 409 instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Embedded scope or connection storage is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
