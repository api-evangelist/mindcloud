paths:
  /v2/openapi.json:
    get:
      operationId: v2-get-openapi-document
      summary: Get this OpenAPI document
      description: The OpenAPI 3.1 document describing the v2 surface, generated from the endpoint registry. No authentication required.
      tags:
      - Meta
      security: []
