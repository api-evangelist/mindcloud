openapi: 3.2.0
info:
  title: Mindcloud Workflows API
  version: 2.0.0
  description: 'Operations tagged workflows across 3 of this provider''s published API definitions: connect-mindcloud-openapi.json, connect-mindcloud-openapi.json, mindcloud-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://connect.mindcloud.co
security:
- apiKey: []
tags:
- name: Workflows
paths:
  /v2/workflows:
    get:
      operationId: v2-list-workflows
      summary: List workflows for the company with filtering, sorting, and pagination
      description: 'List workflows for the company with filtering, sorting, and pagination. The workflow definition is only available on the detail endpoint.


        Each filterable field is also a query parameter: `status=active` matches it exactly, and bracket operators (eq, ne, gt, gte, lt, lte, contains, starts, ends, in, nin) compare, e.g. `createdOn[gte]=2026-01-01` or `status[in]=failed,cancelled`. contains, starts, and ends apply to text fields only.


        Requires the API key permission workflow:view.'
      tags:
      - Workflows
      security:
      - apiKey:
        - workflow:view
      parameters:
      - name: fields
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated fields to return; all of them when left out, and id always. Each item then carries only those keys, whatever its schema requires. Fields: id, name, type, isActive, isTemplate, size, tags, createdOn, createdBy, updatedOn, updatedBy.'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated sort fields; prefix one with - for descending. Sortable fields: id, name, type, isActive, isTemplate, size, tags, createdOn, createdBy, updatedOn, updatedBy. Default: -createdOn.'
      - name: where
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
        description: 'RSQL filter expression. Filterable fields: id, name, type, isActive, isTemplate, size, tags, createdOn, createdBy, updatedOn, updatedBy. Operators: ==, !=, >, >=, <, <=, =in=, =out=, =like=. Logical: ; (AND), , (OR); AND binds tighter than OR. Example: "status==active;name=like=Sales*"'
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on id: `id=value` matches it exactly. Bracket operators: `id[ne]`, `id[gt]`, `id[gte]`, `id[lt]`, `id[lte]`, `id[contains]`, `id[starts]`, `id[ends]`, and `id[in]` / `id[nin]` with comma-separated values.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on name: `name=value` matches it exactly. Bracket operators: `name[ne]`, `name[gt]`, `name[gte]`, `name[lt]`, `name[lte]`, `name[contains]`, `name[starts]`, `name[ends]`, and `name[in]` / `name[nin]` with comma-separated values.'
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on type: `type=value` matches it exactly. Bracket operators: `type[ne]`, `type[gt]`, `type[gte]`, `type[lt]`, `type[lte]`, `type[contains]`, `type[starts]`, `type[ends]`, and `type[in]` / `type[nin]` with comma-separated values.'
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
        description: 'Filter on isActive: `isActive=value` matches it exactly. Bracket operators: `isActive[ne]`, `isActive[gt]`, `isActive[gte]`, `isActive[lt]`, `isActive[lte]`, and `isActive[in]` / `isActive[nin]` with comma-separated values.'
      - name: isTemplate
        in: query
        required: false
        schema:
          type: boolean
        description: 'Filter on isTemplate: `isTemplate=value` matches it exactly. Bracket operators: `isTemplate[ne]`, `isTemplate[gt]`, `isTemplate[gte]`, `isTemplate[lt]`, `isTemplate[lte]`, and `isTemplate[in]` / `isTemplate[nin]` with comma-separated values.'
      - name: size
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on size: `size=value` matches it exactly. Bracket operators: `size[ne]`, `size[gt]`, `size[gte]`, `size[lt]`, `size[lte]`, `size[contains]`, `size[starts]`, `size[ends]`, and `size[in]` / `size[nin]` with comma-separated values.'
      - name: tags
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on tags: `tags=value` matches it exactly. Bracket operators: `tags[ne]`, `tags[gt]`, `tags[gte]`, `tags[lt]`, `tags[lte]`, `tags[contains]`, `tags[starts]`, `tags[ends]`, and `tags[in]` / `tags[nin]` with comma-separated values.'
      - name: createdOn
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on createdOn: `createdOn=value` matches it exactly. A date or timestamp, such as 2026-10-01 or 2026-10-01T12:00:00Z. Bracket operators: `createdOn[ne]`, `createdOn[gt]`, `createdOn[gte]`, `createdOn[lt]`, `createdOn[lte]`, and `createdOn[in]` / `createdOn[nin]` with comma-separated values.'
      - name: createdBy
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on createdBy: `createdBy=value` matches it exactly. Bracket operators: `createdBy[ne]`, `createdBy[gt]`, `createdBy[gte]`, `createdBy[lt]`, `createdBy[lte]`, `createdBy[contains]`, `createdBy[starts]`, `createdBy[ends]`, and `createdBy[in]` / `createdBy[nin]` with comma-separated values.'
      - name: updatedOn
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on updatedOn: `updatedOn=value` matches it exactly. A date or timestamp, such as 2026-10-01 or 2026-10-01T12:00:00Z. Bracket operators: `updatedOn[ne]`, `updatedOn[gt]`, `updatedOn[gte]`, `updatedOn[lt]`, `updatedOn[lte]`, and `updatedOn[in]` / `updatedOn[nin]` with comma-separated values.'
      - name: updatedBy
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on updatedBy: `updatedBy=value` matches it exactly. Bracket operators: `updatedBy[ne]`, `updatedBy[gt]`, `updatedBy[gte]`, `updatedBy[lt]`, `updatedBy[lte]`, `updatedBy[contains]`, `updatedBy[starts]`, `updatedBy[ends]`, and `updatedBy[in]` / `updatedBy[nin]` with comma-separated values.'
      - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
                required:
                - success
                - data
                - meta
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: v2-create-workflow
      summary: Create an empty workflow (metadata only)
      description: 'Create an empty workflow (metadata only). New workflows start disabled; add steps in the app, then enable via PATCH /v2/workflows/:workflowId.


        Requires the API key permission workflow:create.'
      tags:
      - Workflows
      security:
      - apiKey:
        - workflow:create
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
                tags:
                  default: []
                  maxItems: 50
                  type: array
                  items:
                    type: string
                    minLength: 1
              required:
              - name
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/Workflow'
                  meta:
                    type: object
                    description: 'Response metadata, on endpoints that answer it: the usage window, a step count, or the provider paging of a Universal action run.'
                required:
                - success
                - data
        '400':
          description: The request body is invalid (INVALID_QUERY).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The insert returned no row (WORKFLOW_CREATE_FAILED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://connect.mindcloud.co
  /v2/workflows/{workflowId}:
    get:
      operationId: v2-get-workflow
      summary: Get one workflow, including its full definition and summary
      description: 'Get one workflow, including its full definition and summary.


        Requires the API key permission workflow:view.'
      tags:
      - Workflows
      security:
      - apiKey:
        - workflow:view
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/WorkflowDetail'
                  meta:
                    type: object
                    description: 'Response metadata, on endpoints that answer it: the usage window, a step count, or the provider paging of a Universal action run.'
                required:
                - success
                - data
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: v2-update-workflow
      summary: 'Update workflow metadata: rename, enable or disable through isActive, or…'
      description: 'Update workflow metadata: rename, enable or disable through isActive, or replace the assigned tags.


        Requires the API key permission workflow:edit.'
      tags:
      - Workflows
      security:
      - apiKey:
        - workflow:edit
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
                isActive:
                  type: boolean
                tags:
                  maxItems: 50
                  type: array
                  items:
                    type: string
                    minLength: 1
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/Workflow'
                  meta:
                    type: object
                    description: 'Response metadata, on endpoints that answer it: the usage window, a step count, or the provider paging of a Universal action run.'
                required:
                - success
                - data
        '400':
          description: The request is invalid, or none of "name", "isActive", or "tags" was provided (INVALID_QUERY, NO_FIELDS_TO_UPDATE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No workflow with this id belongs to the company (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: v2-delete-workflow
      summary: Soft-delete a workflow
      description: 'Soft-delete a workflow. The workflow is disabled and disappears from the API, along with its recorded runs.


        Requires the API key permission workflow:delete.'
      tags:
      - Workflows
      security:
      - apiKey:
        - workflow:delete
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/DeletedResource'
                  meta:
                    type: object
                    description: 'Response metadata, on endpoints that answer it: the usage window, a step count, or the provider paging of a Universal action run.'
                required:
                - success
                - data
        '400':
          description: The request is invalid (INVALID_QUERY).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No workflow with this id belongs to the company (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://connect.mindcloud.co
  /v2/workflows/{workflowId}/duplicate:
    post:
      operationId: v2-duplicate-workflow
      summary: Duplicate a workflow within the company, including its steps and schedules
      description: 'Duplicate a workflow within the company, including its steps and schedules. The copy starts disabled and is named " (copy)" unless a name is provided.


        Requires the API key permission workflow:create.'
      tags:
      - Workflows
      security:
      - apiKey:
        - workflow:create
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/Workflow'
                  meta:
                    type: object
                    description: 'Response metadata, on endpoints that answer it: the usage window, a step count, or the provider paging of a Universal action run.'
                required:
                - success
                - data
        '400':
          description: The request is invalid (INVALID_QUERY).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No workflow with this id is in the company (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The workflow step graph is invalid (WORKFLOW_GRAPH_INVALID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The duplicated workflow could not be loaded (WORKFLOW_DUPLICATE_FAILED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://connect.mindcloud.co
  /v2/workflows/{workflowId}/run:
    post:
      operationId: v2-run-workflow
      summary: Start a workflow run
      description: 'Start a workflow run. Execution is asynchronous: this returns the run id immediately; poll GET /v2/runs/:runId for the outcome. Runs the published version by default.


        Requires the API key permission workflow:run.'
      tags:
      - Workflows
      security:
      - apiKey:
        - workflow:run
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  default: published
                  type: string
                  enum:
                  - published
                  - draft
                environmentId:
                  type: string
                  minLength: 1
      responses:
        '202':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/QueuedRun'
                  meta:
                    type: object
                    description: 'Response metadata, on endpoints that answer it: the usage window, a step count, or the provider paging of a Universal action run.'
                required:
                - success
                - data
        '400':
          description: The request is invalid, or the environment id is unknown to the company (INVALID_QUERY, UNKNOWN_ENVIRONMENT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No workflow with this id belongs to the company (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The workflow is disabled (WORKFLOW_DISABLED), or has no published version to run (WORKFLOW_NOT_PUBLISHED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The run could not be enqueued (RUN_ENQUEUE_FAILED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://connect.mindcloud.co
  /v2/workflows/{workflowId}/versions:
    get:
      operationId: v2-list-workflow-versions
      summary: 'List versions of a workflow: the mutable draft (version "draft") plus published…'
      description: 'List versions of a workflow: the mutable draft (version "draft") plus published and unpublished snapshots, newest first.


        Requires the API key permission workflow:view.'
      tags:
      - Workflows
      security:
      - apiKey:
        - workflow:view
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowVersion'
                  meta:
                    type: object
                    description: 'Response metadata, on endpoints that answer it: the usage window, a step count, or the provider paging of a Universal action run.'
                required:
                - success
                - data
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://connect.mindcloud.co
  /v2/workflows/{workflowId}/runs:
    get:
      operationId: v2-list-runs
      summary: List runs of one workflow with filtering, sorting, and pagination
      description: 'List runs of one workflow with filtering, sorting, and pagination. Filter by status, version, environmentId, startedOn range, endUserId, or installationId.


        Each filterable field is also a query parameter: `status=active` matches it exactly, and bracket operators (eq, ne, gt, gte, lt, lte, contains, starts, ends, in, nin) compare, e.g. `createdOn[gte]=2026-01-01` or `status[in]=failed,cancelled`. contains, starts, and ends apply to text fields only.


        Requires the API key permission log:view.'
      tags:
      - Workflows
      security:
      - apiKey:
        - log:view
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: fields
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated fields to return; all of them when left out, and id always. Each item then carries only those keys, whatever its schema requires. Fields: id, workflowId, status, version, environmentId, environmentName, startedOn, finishedOn, durationMs, operations, errorCount, warningCount, infoCount, endUserId, installationId, triggerAppSlug.'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated sort fields; prefix one with - for descending. Sortable fields: id, workflowId, status, version, environmentId, environmentName, startedOn, finishedOn, durationMs, operations, errorCount, warningCount, infoCount, endUserId, installationId, triggerAppSlug. Default: -startedOn.'
      - name: where
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
        description: 'RSQL filter expression. Filterable fields: id, workflowId, status, version, environmentId, environmentName, startedOn, finishedOn, durationMs, operations, errorCount, warningCount, infoCount, endUserId, installationId, triggerAppSlug. Operators: ==, !=, >, >=, <, <=, =in=, =out=, =like=. Logical: ; (AND), , (OR); AND binds tighter than OR. Example: "status==active;name=like=Sales*"'
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on id: `id=value` matches it exactly. Bracket operators: `id[ne]`, `id[gt]`, `id[gte]`, `id[lt]`, `id[lte]`, `id[contains]`, `id[starts]`, `id[ends]`, and `id[in]` / `id[nin]` with comma-separated values.'
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on status: `status=value` matches it exactly. Bracket operators: `status[ne]`, `status[gt]`, `status[gte]`, `status[lt]`, `status[lte]`, `status[contains]`, `status[starts]`, `status[ends]`, and `status[in]` / `status[nin]` with comma-separated values.'
      - name: version
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on version: `version=value` matches it exactly. Bracket operators: `version[ne]`, `version[gt]`, `version[gte]`, `version[lt]`, `version[lte]`, `version[contains]`, `version[starts]`, `version[ends]`, and `version[in]` / `version[nin]` with comma-separated values.'
      - name: environmentId
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on environmentId: `environmentId=value` matches it exactly. Bracket operators: `environmentId[ne]`, `environmentId[gt]`, `environmentId[gte]`, `environmentId[lt]`, `environmentId[lte]`, `environmentId[contains]`, `environmentId[starts]`, `environmentId[ends]`, and `environmentId[in]` / `environmentId[nin]` with comma-separated values.'
      - name: environmentName
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on environmentName: `environmentName=value` matches it exactly. Bracket operators: `environmentName[ne]`, `environmentName[gt]`, `environmentName[gte]`, `environmentName[lt]`, `environmentName[lte]`, `environmentName[contains]`, `environmentName[starts]`, `environmentName[ends]`, and `environmentName[in]` / `environmentName[nin]` with comma-separated values.'
      - name: startedOn
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on startedOn: `startedOn=value` matches it exactly. A date or timestamp, such as 2026-10-01 or 2026-10-01T12:00:00Z. Bracket operators: `startedOn[ne]`, `startedOn[gt]`, `startedOn[gte]`, `startedOn[lt]`, `startedOn[lte]`, and `startedOn[in]` / `startedOn[nin]` with comma-separated values.'
      - name: finishedOn
        in: query
        required: false
        schema:
          type: string
        description: 'Filter on finishedOn: `finishedOn=value` matches it exactly. A date or timestamp, such as 2026-10-01 or 2026-10-01T12:00:00Z. Bracket operators: `finishedOn[ne]`, `finishedOn[gt]`, `finishedOn[gte]`, `finishedOn[lt]`, `finishedOn[lte]`, and `finishedOn[in]` / `finishedOn[nin]` with comma-separated values.'
      - name: durationMs
        in: query
        required: false
        schema:
          type: number
        description: 'Filter on durationMs: `durationMs=value` matches it exactly. Bracket operators: `durationMs[ne]`, `durationMs[gt]`, `durationMs[gte]`, `durationMs[lt]`, `durationMs[lte]`, and `durationMs[in]` / `durationMs[nin]` with comma-separated values.'
      - name: operations
        in: query
        required: false
        schema:
          type: integer
        description: 'Filter on operations: `operations=value` matches it exactly. Bracket operators: `operations[ne]`, `operations[gt]`, `operations[gte]`, `operations[lt]`, `operations[lte]`, and `operations[in]` / `operations[nin]` with comma-separated values.'
      - name: errorCount
        in: query
        required: false
        schema:
          type: integer
